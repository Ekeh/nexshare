
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexshare
      POSTGRES_PASSWORD: nexshare
      POSTGRES_DB: nexshare
    ports:
      - "5432:5432"
    volumes:
      - nexshare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexshare -d nexshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexshare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexshare_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexshare_postgres_data:
  nexshare_redis_data:
